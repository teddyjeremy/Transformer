[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-english-french"
version = "0.1.0"
description = "A from-scratch PyTorch Transformer for English-to-French translation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "datasets>=2.18",
    "tokenizers>=0.15",
    "torchmetrics>=1.3",
    "tensorboard>=2.16",
    "tqdm>=4.66"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]
